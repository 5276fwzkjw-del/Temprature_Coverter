<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="converter-card">
    <header class="converter-header">
      <span class="badge">Frontend Dev</span>
      <h1>Temperature Converter</h1>
      <p>Sleek utility interface built to handle dynamic mathematical coordinate transforms across standard temperature scales in real time.</p>
    </header>

    <main class="converter-body">
      <div class="input-group">
        <label for="celsius">Celsius (°C)</label>
        <div class="field-wrapper">
          <input type="number" id="celsius" placeholder="0" step="any">
        </div>
      </div>

      <div class="input-group">
        <label for="fahrenheit">Fahrenheit (°F)</label>
        <div class="field-wrapper">
          <input type="number" id="fahrenheit" placeholder="32" step="any">
        </div>
      </div>

      <div class="input-group">
        <label for="kelvin">Kelvin (K)</label>
        <div class="field-wrapper">
          <input type="number" id="kelvin" placeholder="273.15" step="any">
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
